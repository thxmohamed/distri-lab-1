name: Build and publish Docker image

# El workflow se dispara cuando un push tiene modificaciones al archivo Dockerfile en la rama main
on:
  push:
    branches: [main]
    paths:
      - Dockerfile

# ghcr.io es el registro de contenedores de GitHub
env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Permite a checkout leer el repositorio
      packages: write # Permite subir la imagen al GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pasa el nombre del repositorio a minúsculas y define la ruta de la imagen como output del step
      - name: Image name
        id: vars
        run: |
          repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lc}:base" >> "$GITHUB_OUTPUT"

      # Entra al registro de contenedores del repositorio
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye la imagen y la sube al registro de contenedores en la ruta definida en el output del step vars
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}
