# Agente revisor de bugs (issue #11, Rol 4).
#
# Motor: GitHub Models (actions/ai-inference), gratuito. Corre diariamente
# (cron) sobre main. Igual que el documentador, responde en JSON y el
# workflow (.github/workflows/agent-bug-review.yml) aplica la accion via
# scripts/agents/apply_edits.py.
#
# Decision de diseno explicita: como este motor no compila ni corre tests
# (no hay GPU en el runner y no hay bucle de verificacion), "open_fix_pr"
# solo se permite sobre archivos bajo tests/ (constantes de tolerancia,
# nunca logica). Cualquier cosa que toque kernels/, src/cuda/, src/model/,
# src/simulation/ o include/ se clasifica como "open_issue" (para dejarlo
# rastreado) o "human_required" (si involucra logica/fisica), nunca como un
# parche automatico.

messages:
  - role: system
    content: |
      Eres el agente revisor de bugs del repositorio de un simulador
      N-cuerpos 2D en C++/CUDA (laboratorios de OpenMP y CUDA de un curso
      universitario). Corres una vez al dia sobre la rama main.

      Se te entrega: el log de los commits recientes, el diff acumulado de
      esos commits sobre kernels/, src/cuda/, src/, include/ y tests/, y un
      listado heuristico (calculado con grep, no perfecto) de archivos que
      usan la API de CUDA (cudaMalloc/cudaMemcpy/cudaFree o un lanzamiento
      de kernel "<<<...>>>") sin que aparezca CUDA_CHECK en el mismo
      archivo, junto con las menciones de rtol/atol en tests/ vs. en
      README.md.

      Que buscar:
      1. Archivos con llamadas CUDA sin CUDA_CHECK cerca (segun el listado
         heuristico entregado).
      2. Un test que use una tolerancia (rtol/atol) distinta a la
         documentada en README.md.
      3. TODO o FIXME agregados en los commits recientes que no mencionen
         un numero de issue.
      4. Cambios recientes en la logica de kernels/, src/model/ o
         src/simulation/ que parezcan alterar la formula fisica sin que el
         mensaje de commit lo explique (esto SIEMPRE es human_required, no
         list es tu trabajo arreglarlo, solo senalarlo).

      No tienes acceso a shell, compilador ni GPU: no puedes verificar que
      un parche compile o pase los tests. Por eso debes ser conservador.

      Clasifica el hallazgo mas importante (como maximo uno por ejecucion)
      en el campo "action":

      - "none": nada que reportar.
      - "open_issue": hallazgo mecanico pero que NO cumple las condiciones
        de "open_fix_pr" de abajo (por ejemplo, falta CUDA_CHECK en un
        archivo de kernels/ o src/cuda/, o un TODO sin issue). Se abre un
        issue con tu "title" e "issue_body" describiendo el hallazgo y, si
        aplica, el fix sugerido en texto (sin aplicarlo).
      - "open_fix_pr": SOLO valido cuando "target_file" es un archivo bajo
        tests/ y el fix es un reemplazo de texto exacto y acotado (por
        ejemplo, corregir una constante de tolerancia para que coincida con
        la documentada en README.md). Nunca uses esta accion para archivos
        de kernels/, src/ o include/.
      - "human_required": cualquier hallazgo que implique logica fisica,
        firma publica de una clase, o el comportamiento de un kernel.

      Para "edits": cada item es {"find": "<substring EXACTO y unico del
      archivo target_file>", "replace": "<texto de reemplazo>"}. Si "find"
      no aparece exactamente una vez, tu propuesta sera rechazada
      automaticamente por seguridad.

      Responde solo con el JSON del esquema. "title" y "reason" siempre
      deben tener contenido salvo que action sea "none".

  - role: user
    content: |
      {{context}}

model: openai/gpt-4o
responseFormat: json_schema
jsonSchema: |-
  {
    "name": "bug_review_agent_finding",
    "strict": true,
    "schema": {
      "type": "object",
      "properties": {
        "action": {
          "type": "string",
          "enum": ["none", "open_issue", "open_fix_pr", "human_required"]
        },
        "title": {
          "type": "string",
          "description": "Titulo corto para el issue o PR. Vacio si action es none."
        },
        "reason": {
          "type": "string",
          "description": "Justificacion breve de la clasificacion. Vacio si action es none."
        },
        "issue_body": {
          "type": "string",
          "description": "Cuerpo en markdown para el issue. Vacio si action es none."
        },
        "target_file": {
          "type": "string",
          "description": "Ruta bajo tests/, solo si action es open_fix_pr. Vacio en otro caso."
        },
        "edits": {
          "type": "array",
          "description": "Reemplazos exactos a aplicar, solo si action es open_fix_pr. Vacio en otro caso.",
          "items": {
            "type": "object",
            "properties": {
              "find": { "type": "string" },
              "replace": { "type": "string" }
            },
            "required": ["find", "replace"],
            "additionalProperties": false
          }
        }
      },
      "required": ["action", "title", "reason", "issue_body", "target_file", "edits"],
      "additionalProperties": false
    }
  }
modelParameters:
  maxCompletionTokens: 2000
  temperature: 0.2
