# Nombre del flujo de trabajo
name: CI

# Especifica los eventos que dispararán el flujo de trabajo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

# Flujo de trabajo
jobs:
  compile-and-test:
    # Nombre del trabajo
    name: Compile and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      # Clona el repositorio en la máquina virtual de GitHub Actions
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name
        id: vars
        run: |
          repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lc}:base" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # detecta cambios en el dockerfile al momento de hacer un pull request (para determinar si se debe reconstruir la imagen o usar la guardada en GHCR)
      - name: Check if Dockerfile changed
        id: docker_changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | grep -q '^Dockerfile$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Si el PR modifica el Dockerfile, construye localmente para probar el cambio real.
      # Si no, intenta usar la imagen publicada en GHCR para aprovechar la caché, y solo
      # construye localmente si no existe (primer push, fork sin imagen publicada, etc.).
      - name: Pull or build base image
        run: |
          if [ "${{ steps.docker_changed.outputs.changed }}" = "true" ]; then
            echo "Dockerfile modificado en este PR. Construyendo localmente..."
            docker build -t ${{ steps.vars.outputs.image }} .
          elif docker pull ${{ steps.vars.outputs.image }}; then
            echo "Imagen obtenida desde GHCR."
          else
            echo "Imagen no encontrada en GHCR. Construyendo localmente desde el Dockerfile..."
            docker build -t ${{ steps.vars.outputs.image }} .
          fi

      # Verifica que la imagen se ha construido correctamente ejecutando el comando g++ --version para ver si se instalo el compilador de C++
      # "-v ${{ github.workspace }}:/app" monta el directorio con la última versión del código en el contenedor
      - name: Verify toolchain
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ steps.vars.outputs.image }} g++ --version

      - name: Build project
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ steps.vars.outputs.image }} make

      - name: Run tests
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ steps.vars.outputs.image }} make test
