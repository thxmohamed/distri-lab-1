name: Agent - Documentador

# Corre semanalmente y al fusionar cambios en main, ademas de poder
# dispararse manualmente para dejar evidencia antes de la entrega.
on:
  schedule:
    - cron: "0 13 * * 1" # Lunes 13:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  documentation-agent:
    name: Revisar documentacion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar git para commits del agente
        run: |
          git config user.name "docs-agent[bot]"
          git config user.email "docs-agent@users.noreply.github.com"

      - name: Cargar prompt del agente
        id: load_prompt
        run: |
          {
            echo 'body<<AGENT_PROMPT_EOF'
            cat scripts/agents/documentador.md
            echo AGENT_PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ejecutar agente documentador
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            EVENTO: ${{ github.event_name }}

            ${{ steps.load_prompt.outputs.body }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*),Bash(git diff:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh pr create:*)"
